name: Candidate 600-cell McKay E8 closure v0.3

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911
    paths:
      - 'src/phasenav_natural_code/candidate_600cell_mckay_e8_v03.py'
      - 'tests/test_candidate_600cell_mckay_e8_v03.py'
      - '.github/workflows/candidate-600cell-mckay-e8-v03.yml'
  pull_request:
    paths:
      - 'src/phasenav_natural_code/candidate_600cell_mckay_e8_v03.py'
      - 'tests/test_candidate_600cell_mckay_e8_v03.py'
      - '.github/workflows/candidate-600cell-mckay-e8-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable-mckay-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run McKay closure tests
        run: pytest -q tests/test_candidate_600cell_mckay_e8_v03.py
      - name: Assert no runtime Laplacian promotion
        run: |
          python - <<'PY'
          from phasenav_natural_code.candidate_600cell_mckay_e8_v03 import (
              candidate_metadata,
              validate_exact_closure,
          )
          meta = candidate_metadata()
          receipt = validate_exact_closure(candidate_enabled=True)
          assert meta['runtime_laplacian_extension_authorized'] is False
          assert meta['runtime_default'] is False
          assert meta['canon_write_authority'] is False
          assert meta['physical_binding'] == 'OPEN'
          assert receipt.ell6_coefficient_rank == 25
          assert receipt.ell7_coefficient_rank == 40
          assert receipt.ell7_cumulative_rank == 120
          print('PASS: representation closure is executable without promoting ell>5 dynamics')
          PY