name: Candidate carrier hierarchy v0.2

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911-v02
    paths:
      - 'src/phasenav_natural_code/phasenav_carrier_hierarchy_v02.py'
      - 'src/phasenav_natural_code/phasenav_promotion_geometry_v01.py'
      - 'tests/test_phasenav_carrier_hierarchy_v02.py'
      - 'docs/PHASENAV_CARRIER_HIERARCHY_V0_2.md'
      - '.github/workflows/candidate-carrier-hierarchy-v02.yml'
  pull_request:
    paths:
      - 'src/phasenav_natural_code/phasenav_carrier_hierarchy_v02.py'
      - 'src/phasenav_natural_code/phasenav_promotion_geometry_v01.py'
      - 'tests/test_phasenav_carrier_hierarchy_v02.py'
      - 'docs/PHASENAV_CARRIER_HIERARCHY_V0_2.md'
      - '.github/workflows/candidate-carrier-hierarchy-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier-hierarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pytest numpy
      - name: Run 1Q-4Q carrier hierarchy candidate gate
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_phasenav_carrier_hierarchy_v02.py
