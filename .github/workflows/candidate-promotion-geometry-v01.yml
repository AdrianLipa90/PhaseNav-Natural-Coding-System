name: Candidate promotion geometry v0.1

on:
  push:
    branches:
      - candidate/600cell-working-layer-v0.1-20260911
    paths:
      - 'src/phasenav_natural_code/phasenav_promotion_geometry_v01.py'
      - 'tests/test_phasenav_promotion_geometry_v01.py'
      - 'docs/PHASENAV_PROMOTION_GEOMETRY_V0_1.md'
      - '.github/workflows/candidate-promotion-geometry-v01.yml'
  pull_request:
    paths:
      - 'src/phasenav_natural_code/phasenav_promotion_geometry_v01.py'
      - 'tests/test_phasenav_promotion_geometry_v01.py'
      - 'docs/PHASENAV_PROMOTION_GEOMETRY_V0_1.md'
      - '.github/workflows/candidate-promotion-geometry-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pytest numpy
      - name: Run promotion geometry candidate gate
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_phasenav_promotion_geometry_v01.py
