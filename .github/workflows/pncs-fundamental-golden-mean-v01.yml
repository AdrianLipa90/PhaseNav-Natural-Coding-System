name: PNCS fundamental golden-mean v0.1

on:
  push:
    branches:
      - main
      - candidate/fundamental-golden-mean-v0.1-20260915
    paths:
      - 'src/phasenav_natural_code/golden_mean_dynamics_v01.py'
      - 'tests/test_golden_mean_dynamics_v01.py'
      - 'docs/PNCS_FUNDAMENTAL_GOLDEN_MEAN_KERNEL_V0_1.md'
      - 'provenance/receipts/PNCS_FUNDAMENTAL_GOLDEN_MEAN_IMPORT_V0_1.json'
      - '.github/workflows/pncs-fundamental-golden-mean-v01.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/phasenav_natural_code/golden_mean_dynamics_v01.py'
      - 'tests/test_golden_mean_dynamics_v01.py'
      - 'docs/PNCS_FUNDAMENTAL_GOLDEN_MEAN_KERNEL_V0_1.md'
      - 'provenance/receipts/PNCS_FUNDAMENTAL_GOLDEN_MEAN_IMPORT_V0_1.json'
      - '.github/workflows/pncs-fundamental-golden-mean-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dedicated-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run fundamental golden-mean tests
        run: python -m pytest -q tests/test_golden_mean_dynamics_v01.py

  full-pncs-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Run full PNCS test suite
        run: python -m pytest -q
