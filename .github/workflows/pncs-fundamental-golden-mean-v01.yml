name: PNCS golden-mean post-v1 quarantine v0.1

on:
  push:
    paths:
      - 'src/phasenav_natural_code/release_train_v1.py'
      - 'src/phasenav_natural_code/golden_mean_dynamics_v01.py'
      - 'tests/test_golden_mean_dynamics_v01.py'
      - 'tests/test_post_v1_golden_mean_quarantine_v01.py'
      - 'research/post_v1/fundamental_golden_mean_v01/**'
      - 'docs/PNCS_FUNDAMENTAL_GOLDEN_MEAN_KERNEL_V0_1.md'
      - 'provenance/receipts/PNCS_FUNDAMENTAL_GOLDEN_MEAN_QUARANTINE_V0_1.json'
      - '.github/workflows/pncs-fundamental-golden-mean-v01.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify release-train and quarantine invariants
        run: python -m pytest -q tests/test_release_train_v1.py tests/test_post_v1_golden_mean_quarantine_v01.py
      - name: Verify active package cannot import quarantined kernel
        run: |
          python -m pip install --disable-pip-version-check .
          python - <<'PY'
          import importlib.util
          spec = importlib.util.find_spec('phasenav_natural_code.golden_mean_dynamics_v01')
          assert spec is None, spec
          print('PASS: golden-mean kernel absent from installed PNCS v1 package')
          PY

  preserved-research-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Re-run exact preserved golden-mean research witness
        env:
          PYTHONPATH: research/post_v1/fundamental_golden_mean_v01/src
        run: python -m pytest -q research/post_v1/fundamental_golden_mean_v01/tests/test_golden_mean_dynamics_v01.py
