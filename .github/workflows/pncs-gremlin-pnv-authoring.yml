      - 'spec/PNCS_GREMLIN_PNV_AUTHORING_V0_2.md'
      - 'spec/PNCS_GREMLIN_LIVE_AUTHORING_V0_3.md'
      - 'spec/PNCS_GREMLIN_RELATIONAL_ISOMORPHISM_COMPILER_V0_1.md'
      - 'spec/PNCS_GREMLIN_RELATION_MINING_ADAPTER_V0_1.md'
      - 'spec/PNCS_GREMLIN_KAKU_RESOLVER_V0_1.md'
      - 'spec/PNCS_FPDG_GREMLIN_PAIN_INGRESS_V0_1.md'
      - 'spec/PNCS_GREMLIN_CANDIDATE_INVERSE_LINEAGE_V0_1.md'
