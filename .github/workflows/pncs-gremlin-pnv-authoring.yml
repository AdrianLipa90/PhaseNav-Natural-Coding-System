name: PNCS GREMLIN PNV authoring

on:
  pull_request:
    paths:
      - 'src/phasenav_natural_code/gremlin_pnv_authoring_v02.py'
      - 'src/phasenav_natural_code/gremlin_native_pnv_bridge_v01.py'
      - 'src/phasenav_natural_code/gremlin_pnv_bridge_v02.py'
      - 'src/phasenav_natural_code/gremlin_relational_compiler_v01.py'
      - 'src/phasenav_natural_code/gremlin_relation_mining_adapter_v01.py'
      - 'src/phasenav_natural_code/gremlin_kaku_resolver_v01.py'
      - 'src/phasenav_natural_code/gremlin_inverse_lineage_v01.py'
      - 'src/phasenav_natural_code/gremlin_pnv_holonomy_v01.py'
      - 'src/phasenav_natural_code/pnv_source_holonomy_v01.py'
      - 'src/phasenav_natural_code/pnv_noether_collective_holonomy_v01.py'
      - 'tests/test_gremlin_pnv_authoring_v02.py'
      - 'tests/test_gremlin_pnv_bridge_v02.py'
      - 'tests/test_gremlin_pnv_bridge_kaku_resolver_v02.py'
      - 'tests/test_gremlin_pnv_bridge_inverse_lineage_v02.py'
      - 'tests/test_gremlin_pnv_bridge_holonomy_v02.py'
      - 'tests/test_gremlin_pnv_bridge_source_holonomy_v02.py'
      - 'tests/test_gremlin_pnv_bridge_noether_collective_v02.py'
      - 'tests/test_gremlin_relational_compiler_v01.py'
      - 'tests/test_gremlin_relation_mining_adapter_v01.py'
      - 'tests/test_gremlin_kaku_resolver_v01.py'
      - 'tests/test_gremlin_kaku_resolver_pipeline_v01.py'
      - 'tests/test_gremlin_inverse_lineage_v01.py'
      - 'tests/test_gremlin_pnv_holonomy_v01.py'
      - 'tests/test_pnv_source_holonomy_v01.py'
      - 'tests/test_pnv_noether_collective_holonomy_v01.py'
      - 'spec/PNCS_GREMLIN_PNV_AUTHORING_V0_2.md'
      - 'spec/PNCS_GREMLIN_RELATIONAL_ISOMORPHISM_COMPILER_V0_1.md'
      - 'spec/PNCS_GREMLIN_RELATION_MINING_ADAPTER_V0_1.md'
      - 'spec/PNCS_GREMLIN_KAKU_RESOLVER_V0_1.md'
      - 'spec/PNCS_GREMLIN_CANDIDATE_INVERSE_LINEAGE_V0_1.md'
      - 'spec/PNCS_PNV_INFORMATION_HOLONOMY_V0_1.md'
      - 'spec/PNCS_PNV_SOURCE_HOLONOMY_LOOPS_V0_1.md'
      - 'spec/PNCS_PNV_NOETHER_COLLECTIVE_CARRIER_V0_1.md'
      - '.github/workflows/pncs-gremlin-pnv-authoring.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_gremlin_pnv_authoring_v02.py tests/test_gremlin_pnv_bridge_v02.py tests/test_gremlin_pnv_bridge_kaku_resolver_v02.py tests/test_gremlin_pnv_bridge_inverse_lineage_v02.py tests/test_gremlin_pnv_bridge_holonomy_v02.py tests/test_gremlin_pnv_bridge_source_holonomy_v02.py tests/test_gremlin_pnv_bridge_noether_collective_v02.py tests/test_gremlin_relational_compiler_v01.py tests/test_gremlin_relation_mining_adapter_v01.py tests/test_gremlin_kaku_resolver_v01.py tests/test_gremlin_kaku_resolver_pipeline_v01.py tests/test_gremlin_inverse_lineage_v01.py tests/test_gremlin_pnv_holonomy_v01.py tests/test_pnv_source_holonomy_v01.py tests/test_pnv_noether_collective_holonomy_v01.py tests/test_gremlin_native_pnv_bridge_v01.py tests/test_native_pnv_exec_v01.py
