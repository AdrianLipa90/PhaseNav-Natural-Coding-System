name: PNCS native PNV exec

on:
  push:
    branches:
      - feat/native-pnv-exec-tool
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-native-pnv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_native_pnv_exec_v01.py tests/test_gremlin_native_pnv_bridge_v01.py
