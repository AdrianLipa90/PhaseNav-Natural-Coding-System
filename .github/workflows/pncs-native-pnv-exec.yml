name: PNCS native PNV exec

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/phasenav_natural_code/native_pnv_exec_v01.py'
      - 'src/phasenav_natural_code/gremlin_native_pnv_bridge_v01.py'
      - 'tests/test_native_pnv_exec_v01.py'
      - 'tests/test_gremlin_native_pnv_bridge_v01.py'
      - 'tests/test_dncrypt_native_pncs_v04_causality.py'
      - 'native/PNCS_NATIVE_PNV_EXEC_TOOL_V0_1.pnv'
      - 'native/programs/DNCRYPT_NATIVE_PNCS_V0_4.pnv'
      - 'provenance/receipts/PNCS_DNCRYPT_V0_4_CAUSALITY_SYNC_RECEIPT.json'
      - '.github/workflows/pncs-native-pnv-exec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-native-pnv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/test_native_pnv_exec_v01.py
          tests/test_gremlin_native_pnv_bridge_v01.py
          tests/test_dncrypt_native_pncs_v04_causality.py
