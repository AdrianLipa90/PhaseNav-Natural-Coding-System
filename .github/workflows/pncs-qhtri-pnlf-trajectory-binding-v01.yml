name: PNCS QHTRI PNLF trajectory binding v0.1

on:
  pull_request:
    paths:
      - 'src/phasenav_natural_code/qhtri_pnlf_trajectory_binding_v01.py'
      - 'spec/PNCS_QHTRI_PNLF_TRAJECTORY_BINDING_V0_1.md'
      - 'tests/test_qhtri_pnlf_trajectory_binding_v01.py'
      - 'src/phasenav_natural_code/semantic_htri_drive_v32.py'
      - 'src/phasenav_natural_code/semantic_htri_bounded_v33.py'
      - 'src/phasenav_natural_code/orch_orbital_time_v27.py'
      - 'src/phasenav_natural_code/pnlf_orbital_memory_v01.py'
      - '.github/workflows/pncs-qhtri-pnlf-trajectory-binding-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-qhtri-pnlf-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -U pytest numpy

      - name: Run QHTRI-PNLF binding gate
        run: |
          python -m pytest -q \
            tests/test_qhtri_pnlf_trajectory_binding_v01.py \
            tests/test_pnlf_orbital_memory_v01.py \
            tests/test_orch_hydro_v27.py \
            tests/test_semantic_htri_drive_v32.py
