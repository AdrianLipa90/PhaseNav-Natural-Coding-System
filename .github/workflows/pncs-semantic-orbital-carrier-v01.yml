name: PNCS Semantic Orbital Carrier v0.1

on:
  push:
    branches:
      - feat/pncs-semantic-orbital-carrier-v0.1
    paths:
      - 'src/phasenav_natural_code/semantic_orbital_carrier_v01.py'
      - 'src/phasenav_natural_code/pnlf_orbital_memory_v01.py'
      - 'tests/test_semantic_orbital_carrier_v01.py'
      - 'tests/test_pnlf_orbital_memory_v01.py'
      - 'spec/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.md'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.json'
      - '.github/workflows/pncs-semantic-orbital-carrier-v01.yml'
  pull_request:
    paths:
      - 'src/phasenav_natural_code/semantic_orbital_carrier_v01.py'
      - 'src/phasenav_natural_code/pnlf_orbital_memory_v01.py'
      - 'tests/test_semantic_orbital_carrier_v01.py'
      - 'tests/test_pnlf_orbital_memory_v01.py'
      - 'spec/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.md'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_semantic_orbital_carrier_v01.py tests/test_pnlf_orbital_memory_v01.py tests/test_gremlin_kaku_resolver_v01.py
