name: PNCS Semantic Orbital Carrier v0.1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/phasenav_natural_code/semantic_orbital_carrier_v01.py'
      - 'src/phasenav_natural_code/semantic_radical_oscillator_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_trajectory_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_htri_bridge_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_htri_bounded_v01.py'
      - 'src/phasenav_natural_code/semantic_magnitude_actuation_firewall_v01.py'
      - 'src/phasenav_natural_code/pnlf_orbital_memory_v01.py'
      - 'src/phasenav_natural_code/semantic_htri_drive_v32.py'
      - 'src/phasenav_natural_code/semantic_htri_bounded_v33.py'
      - 'tests/test_semantic_orbital_carrier_v01.py'
      - 'tests/test_semantic_orbital_carrier_admission_v01.py'
      - 'tests/test_semantic_actuation_radical_admission_v01.py'
      - 'tests/test_semantic_radical_oscillator_v01.py'
      - 'tests/test_semantic_orbital_trajectory_v01.py'
      - 'tests/test_semantic_orbital_trajectory_admission_v01.py'
      - 'tests/test_semantic_orbital_htri_bridge_v01.py'
      - 'tests/test_semantic_htri_lane_profile_immutability_v01.py'
      - 'tests/test_semantic_htri_snapshot_immutability_v01.py'
      - 'tests/test_semantic_orbital_htri_bounded_v01.py'
      - 'tests/test_semantic_magnitude_actuation_firewall_v01.py'
      - 'tests/test_semantic_htri_drive_v32.py'
      - 'tests/test_semantic_htri_bounded_v33.py'
      - 'tests/test_pnlf_orbital_memory_v01.py'
      - 'tests/test_pnlf_orbital_memory_admission_v01.py'
      - 'tests/test_gremlin_kaku_resolver_v01.py'
      - 'spec/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.md'
      - 'spec/PNCS_SEMANTIC_RADICAL_OSCILLATOR_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_HTRI_BRIDGE_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_HTRI_BOUNDED_TRACK_V0_1.md'
      - 'spec/PNCS_SEMANTIC_HTRI_INPUT_ADMISSION_V0_1.md'
      - 'spec/PNCS_SEMANTIC_MAGNITUDE_ACTUATION_FIREWALL_V0_1.md'
      - 'spec/PNCS_PNLF_ORBITAL_MEMORY_ADMISSION_V0_1.md'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_RADICAL_OSCILLATOR_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_HTRI_BRIDGE_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_HTRI_BOUNDED_TRACK_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_MAGNITUDE_ACTUATION_FIREWALL_V0_1.json'
      - '.github/workflows/pncs-semantic-orbital-carrier-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Python
        run: python3 --version
      - name: Install reference dependencies
        run: python3 -m pip install pytest numpy
      - name: Run semantic orbital stack and parent regressions
        env:
          PYTHONPATH: src
        run: >-
          python3 -m pytest -q
          tests/test_semantic_orbital_carrier_v01.py
          tests/test_semantic_orbital_carrier_admission_v01.py
          tests/test_semantic_actuation_radical_admission_v01.py
          tests/test_semantic_orbital_trajectory_v01.py
          tests/test_semantic_orbital_trajectory_admission_v01.py
          tests/test_semantic_orbital_htri_bridge_v01.py
          tests/test_semantic_htri_lane_profile_immutability_v01.py
          tests/test_semantic_htri_snapshot_immutability_v01.py
          tests/test_semantic_orbital_htri_bounded_v01.py
          tests/test_semantic_magnitude_actuation_firewall_v01.py
          tests/test_semantic_radical_oscillator_v01.py
          tests/test_semantic_htri_drive_v32.py
          tests/test_semantic_htri_bounded_v33.py
          tests/test_pnlf_orbital_memory_v01.py
          tests/test_pnlf_orbital_memory_admission_v01.py
          tests/test_gremlin_kaku_resolver_v01.py
