name: PNCS Semantic Orbital Carrier v0.1

on:
  push:
    branches:
      - feat/pncs-semantic-orbital-carrier-v0.1
    paths:
      - 'src/phasenav_natural_code/semantic_orbital_carrier_v01.py'
      - 'src/phasenav_natural_code/semantic_radical_oscillator_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_trajectory_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_htri_bridge_v01.py'
      - 'src/phasenav_natural_code/pnlf_orbital_memory_v01.py'
      - 'src/phasenav_natural_code/semantic_htri_drive_v32.py'
      - 'tests/test_semantic_orbital_carrier_v01.py'
      - 'tests/test_semantic_radical_oscillator_v01.py'
      - 'tests/test_semantic_orbital_trajectory_v01.py'
      - 'tests/test_semantic_orbital_htri_bridge_v01.py'
      - 'tests/test_semantic_htri_drive_v32.py'
      - 'tests/test_pnlf_orbital_memory_v01.py'
      - 'tests/test_gremlin_kaku_resolver_v01.py'
      - 'spec/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.md'
      - 'spec/PNCS_SEMANTIC_RADICAL_OSCILLATOR_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_HTRI_BRIDGE_V0_1.md'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_RADICAL_OSCILLATOR_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_HTRI_BRIDGE_V0_1.json'
      - '.github/workflows/pncs-semantic-orbital-carrier-v01.yml'
  pull_request:
    paths:
      - 'src/phasenav_natural_code/semantic_orbital_carrier_v01.py'
      - 'src/phasenav_natural_code/semantic_radical_oscillator_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_trajectory_v01.py'
      - 'src/phasenav_natural_code/semantic_orbital_htri_bridge_v01.py'
      - 'src/phasenav_natural_code/pnlf_orbital_memory_v01.py'
      - 'src/phasenav_natural_code/semantic_htri_drive_v32.py'
      - 'tests/test_semantic_orbital_carrier_v01.py'
      - 'tests/test_semantic_radical_oscillator_v01.py'
      - 'tests/test_semantic_orbital_trajectory_v01.py'
      - 'tests/test_semantic_orbital_htri_bridge_v01.py'
      - 'tests/test_semantic_htri_drive_v32.py'
      - 'tests/test_pnlf_orbital_memory_v01.py'
      - 'tests/test_gremlin_kaku_resolver_v01.py'
      - 'spec/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.md'
      - 'spec/PNCS_SEMANTIC_RADICAL_OSCILLATOR_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_1.md'
      - 'spec/PNCS_SEMANTIC_ORBITAL_HTRI_BRIDGE_V0_1.md'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_CARRIER_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_RADICAL_OSCILLATOR_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_1.json'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_HTRI_BRIDGE_V0_1.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Python
        run: python3 --version
      - name: Install reference dependencies
        run: python3 -m pip install pytest numpy
      - name: Run semantic orbital carrier, trajectory, HTRI bridge, RADICAL oscillator and parent regressions
        env:
          PYTHONPATH: src
        run: >-
          python3 -m pytest -q
          tests/test_semantic_orbital_carrier_v01.py
          tests/test_semantic_orbital_trajectory_v01.py
          tests/test_semantic_orbital_htri_bridge_v01.py
          tests/test_semantic_radical_oscillator_v01.py
          tests/test_semantic_htri_drive_v32.py
          tests/test_pnlf_orbital_memory_v01.py
          tests/test_gremlin_kaku_resolver_v01.py
