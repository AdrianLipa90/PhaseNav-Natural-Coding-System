name: PNCS Semantic Orbital Trajectory v0.3

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/phasenav_natural_code/semantic_orbital_carrier_v01.py'
      - 'src/phasenav_natural_code/semantic_phase_inverse_v02.py'
      - 'src/phasenav_natural_code/semantic_orbital_trajectory_v03.py'
      - 'tests/test_semantic_orbital_carrier_v01.py'
      - 'tests/test_semantic_phase_inverse_v02.py'
      - 'tests/test_semantic_orbital_trajectory_v03.py'
      - 'spec/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_3.md'
      - 'provenance/receipts/PNCS_SEMANTIC_ORBITAL_TRAJECTORY_V0_3.json'
      - '.github/workflows/pncs-semantic-orbital-trajectory-v03.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Python
        run: python3 --version
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run semantic carrier trajectory corpus
        env:
          PYTHONPATH: src
        run: >-
          python3 -m pytest -q
          tests/test_semantic_orbital_carrier_v01.py
          tests/test_semantic_phase_inverse_v02.py
          tests/test_semantic_orbital_trajectory_v03.py
