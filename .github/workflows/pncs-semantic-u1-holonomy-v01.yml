name: PNCS semantic U1 holonomy v0.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'native/PNCS_NONLOCAL_SEMANTIC_U1_HOLONOMY_V0_1.pnv'
      - 'spec/PNCS_NONLOCAL_SEMANTIC_U1_HOLONOMY_V0_1.md'
      - 'src/phasenav_natural_code/semantic_u1_holonomy_v01.py'
      - 'tests/test_semantic_u1_holonomy_v01.py'
      - '.github/workflows/pncs-semantic-u1-holonomy-v01.yml'

permissions:
  contents: read

jobs:
  semantic-u1-holonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile reference harness
        run: python -m compileall -q src/phasenav_natural_code/semantic_u1_holonomy_v01.py
      - name: Run semantic U1 holonomy gate
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_semantic_u1_holonomy_v01.py
