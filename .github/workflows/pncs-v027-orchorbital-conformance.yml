name: PNCS v0.27 ORCHORBITAL conformance

on:
  push:
    branches:
      - feat/pncs-v0.27-orchorbital-coupling
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-smoke:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact PR-head source, compile and import
        shell: python3 {0}
        run: |
          import compileall
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile
          import urllib.request
          import zipfile

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          head_sha = event.get('pull_request', {}).get('head', {}).get('sha') or os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/zipball/{head_sha}',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              archive = td / 'repo.zip'
              with urllib.request.urlopen(req) as response:
                  archive.write_bytes(response.read())
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(td / 'repo')
              roots = [p for p in (td / 'repo').iterdir() if p.is_dir()]
              if len(roots) != 1:
                  raise RuntimeError(f'unexpected archive roots: {roots}')
              root = roots[0]
              src = root / 'src'
              if not compileall.compile_dir(src / 'phasenav_natural_code', quiet=1):
                  raise RuntimeError('compileall failed')
              sys.path.insert(0, str(src))
              modules = [
                  'phasenav_natural_code.execution_v20_model',
                  'phasenav_natural_code.execution_v20_live',
                  'phasenav_natural_code.execution_v20_state',
                  'phasenav_natural_code.hydro_time_v27',
                  'phasenav_natural_code.hydro_schedule_v27',
                  'phasenav_natural_code.orchorbital_v27',
                  'phasenav_natural_code.orchorbital_hydro_v27',
                  'phasenav_natural_code.orchorbital_executor_v27',
              ]
              for module in modules:
                  __import__(module)
              print(json.dumps({'status':'PASS','exact_head_sha':head_sha,'compiled':True,'imports':modules}, sort_keys=True))
