name: PNCS v0.27 ORCHORBITAL conformance

on:
  push:
    branches:
      - feat/pncs-v0.27-orchorbital-coupling
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_sha_conformance:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: orch-core
            tests: tests/test_orchorbital_v27.py tests/test_orchorbital_foundation_constraints_v27.py
          - label: direct-executor
            tests: tests/test_orchorbital_executor_v27.py
          - label: hydro-core
            tests: tests/test_hydro_time_v27.py
          - label: hydro-schedule
            tests: tests/test_hydro_schedule_v27.py
    env:
      TEST_FILES: ${{ matrix.tests }}
    steps:
      - name: Download immutable PR-head source and run tests
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request
          import zipfile

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          head_sha = event.get('pull_request', {}).get('head', {}).get('sha') or os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://codeload.github.com/{repo}/zip/{head_sha}'
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              archive = td / 'repo.zip'
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(td / 'repo')
              roots = [p for p in (td / 'repo').iterdir() if p.is_dir()]
              if len(roots) != 1:
                  raise RuntimeError(f'unexpected archive roots: {roots}')
              root = roots[0]
              subprocess.run([sys.executable, '-m', 'pip', 'install', 'pytest'], check=True)
              tests = [str(root / p) for p in os.environ['TEST_FILES'].split()]
              env = dict(os.environ)
              env['PYTHONPATH'] = str(root / 'src')
              print(json.dumps({'exact_head_sha': head_sha, 'tests': os.environ['TEST_FILES']}))
              raise SystemExit(subprocess.run([sys.executable, '-m', 'pytest', '-q', *tests], cwd=root, env=env).returncode)
