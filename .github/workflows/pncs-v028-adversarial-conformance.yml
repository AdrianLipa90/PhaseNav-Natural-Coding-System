name: PNCS v0.28 adversarial conformance

on:
  push:
    branches:
      - integration/pncs-v0.28-current-main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run current-main v0.28 gate-scoped suite
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_v28.py
          tests/test_adversarial_authority_v28.py
