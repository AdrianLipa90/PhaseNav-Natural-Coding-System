name: PNCS v0.28 adversarial conformance

on:
  push:
    branches:
      - feat/pncs-v0.28-release-closure
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_self_hosted_pure:
        description: Run pure v0.28 mirror on self-hosted runner
        required: false
        default: false
        type: boolean
      run_live:
        description: Run live /dev/shm NOEMA adversarial gate on self-hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run complete v0.28 pure conformance corpus
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_v28.py
          tests/test_adversarial_authority_v28.py
          tests/test_execution_orch_v27.py
          tests/test_semantic_equivalence_v28.py
          tests/test_adversarial_dynamics_v28.py
          tests/test_orch_hydro_v27.py
          tests/test_orch_package_v27.py
          tests/test_hydro_time_v27.py
          tests/test_hydro_schedule_v27.py
          tests/test_branch_session_collision_v28.py
          tests/test_manifest_tool_v28.py
          tests/test_repository_conformance_v28.py

  hosted-manifest-candidate:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/pncs-v028-postmerge-conformance' }}
    needs: pure-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate authoritative tracked-tree manifest candidate
        run: python scripts/regenerate_manifest.py --root .
      - name: Verify generated manifest candidate
        run: python scripts/regenerate_manifest.py --root . --check
      - name: Record manifest source identity
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          raw = Path('MANIFEST.sha256.json').read_bytes()
          Path('MANIFEST.sha256.json.sha256').write_text(hashlib.sha256(raw).hexdigest() + '\n', encoding='utf-8')
          Path('MANIFEST.source_commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True), encoding='utf-8')
          Path('MANIFEST.source_tree.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pncs-v028-manifest-candidate
          retention-days: 1
          path: |
            MANIFEST.sha256.json
            MANIFEST.sha256.json.sha256
            MANIFEST.source_commit.txt
            MANIFEST.source_tree.txt
          if-no-files-found: error

  pure-self-hosted-mirror:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'fix/pncs-v028-postmerge-conformance') || (github.event_name == 'workflow_dispatch' && inputs.run_self_hosted_pure == true) }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run complete v0.28 pure release gate mirror
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_v28.py
          tests/test_adversarial_authority_v28.py
          tests/test_execution_orch_v27.py
          tests/test_semantic_equivalence_v28.py
          tests/test_adversarial_dynamics_v28.py
          tests/test_orch_hydro_v27.py
          tests/test_orch_package_v27.py
          tests/test_hydro_time_v27.py
          tests/test_hydro_schedule_v27.py
          tests/test_branch_session_collision_v28.py
          tests/test_manifest_tool_v28.py
          tests/test_repository_conformance_v28.py
      - name: Verify deterministic manifest generation on self-hosted mirror
        run: |
          python3 scripts/regenerate_manifest.py --root .
          python3 scripts/regenerate_manifest.py --root . --check

  live-dev-shm:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'fix/pncs-v028-postmerge-conformance') || (github.event_name == 'workflow_dispatch' && inputs.run_live == true) }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify canonical live NOEMA tether
        run: >-
          python3 scripts/noema_aux_tether_guard.py
          --root /dev/shm/ciel_noema
          --require-socket
          --socket /run/user/1000/noema/ciel_headless.sock
      - name: Produce current-session same-snapshot adversarial witness
        env:
          PYTHONPATH: src
        run: >-
          python3 scripts/run_v028_live_witness.py
          --repo-root .
          --root /dev/shm/ciel_noema
          --socket /run/user/1000/noema/ciel_headless.sock
          --persist
      - name: Run all live conformance tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/live
