name: PNCS v0.28 adversarial conformance

on:
  push:
    branches:
      - feat/pncs-v0.28-release-closure
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live /dev/shm NOEMA adversarial gate on self-hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  structural-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run semantic and authority adversarial corpus
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_v28.py
          tests/test_adversarial_authority_v28.py
          tests/test_execution_orch_v27.py

  semantic-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run cross-layer semantic equivalence corpus
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_semantic_equivalence_v28.py

  dynamics-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run pure ORCH hydrodynamic dynamics and v0.27 regression corpus
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_dynamics_v28.py
          tests/test_orch_hydro_v27.py
          tests/test_orch_package_v27.py
          tests/test_hydro_time_v27.py
          tests/test_hydro_schedule_v27.py

  concurrency-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run branch/session collision gate corpus
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_branch_session_collision_v28.py

  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test manifest and pure/live repository separation
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_manifest_tool_v28.py
          tests/test_repository_conformance_v28.py

  pure-self-hosted-mirror:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run complete v0.28 pure release gate mirror
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_v28.py
          tests/test_adversarial_authority_v28.py
          tests/test_execution_orch_v27.py
          tests/test_semantic_equivalence_v28.py
          tests/test_adversarial_dynamics_v28.py
          tests/test_orch_hydro_v27.py
          tests/test_orch_package_v27.py
          tests/test_hydro_time_v27.py
          tests/test_hydro_schedule_v27.py
          tests/test_branch_session_collision_v28.py
          tests/test_manifest_tool_v28.py
          tests/test_repository_conformance_v28.py

  live-dev-shm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live == true }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify canonical live NOEMA tether
        run: >-
          python3 scripts/noema_aux_tether_guard.py
          --root /dev/shm/ciel_noema
          --require-socket
          --socket /run/user/1000/noema/ciel_headless.sock
      - name: Produce current-session same-snapshot adversarial witness
        env:
          PYTHONPATH: src
        run: >-
          python3 scripts/run_v028_live_witness.py
          --repo-root .
          --root /dev/shm/ciel_noema
          --socket /run/user/1000/noema/ciel_headless.sock
          --persist
      - name: Run all live conformance tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/live
