name: PNCS v0.30 resident hotpath

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/phasenav_natural_code/runtime_v30_hot.py'
      - 'tests/test_runtime_v30_hot.py'
      - 'native/PNCS_RESIDENT_HOT_DISPATCH_V0_30.pnv'
      - '.github/workflows/pncs-v030-resident-hotpath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resident-hotpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_runtime_v30_hot.py tests/test_persistent_runtime_v25.py
