name: PNCS v0.30 resident hotpath

on:
  push:
    branches:
      - feat/pncs-v0.30-resident-hotpath
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resident-hotpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_runtime_v30_hot.py tests/test_persistent_runtime_v25.py
