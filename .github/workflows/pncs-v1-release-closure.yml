name: PNCS v1 release closure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run v1 release-train corpus
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_release_train_v1.py
          tests/test_release_train_native_v1.py
      - name: Generate authoritative tracked-tree manifest candidate
        run: python scripts/regenerate_manifest.py --root .
      - name: Verify generated manifest candidate
        run: python scripts/regenerate_manifest.py --root . --check
      - name: Record exact closure identities
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          raw = Path('MANIFEST.sha256.json').read_bytes()
          Path('MANIFEST.sha256.json.sha256').write_text(hashlib.sha256(raw).hexdigest() + '\n', encoding='utf-8')
          Path('MANIFEST.source_commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True), encoding='utf-8')
          Path('MANIFEST.source_tree.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True), encoding='utf-8')
          PY
      - name: Upload compact release-closure provenance
        uses: actions/upload-artifact@v4
        with:
          name: pncs-v1-release-closure-manifest
          retention-days: 1
          path: |
            MANIFEST.sha256.json
            MANIFEST.sha256.json.sha256
            MANIFEST.source_commit.txt
            MANIFEST.source_tree.txt
          if-no-files-found: error
