name: PNCS v1 release closure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference test dependencies
        run: python -m pip install pytest numpy
      - name: Run consolidated v1 and post-merge regression corpus
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_release_train_v1.py
          tests/test_release_train_native_v1.py
          tests/test_post_consolidation_workflow_integrity_v01.py
          tests/test_manifest_tool_v28.py
          tests/test_model_integrity_v01.py
          tests/test_gremlin_strict_admission_v01.py
          tests/test_gremlin_strict_admission_consumers_v01.py
          tests/test_full_program_executor_v01.py
          tests/test_full_program_executor_receipt_integrity_v01.py
          tests/test_runtime_v30_hot.py
          tests/test_native_pnv_exec_v01.py
          tests/test_gremlin_pnv_authoring_v02.py
          tests/test_gremlin_pnv_authoring_canonical_boundary_v01.py
          tests/test_gremlin_radical_candidate_integrity_v01.py
          tests/test_gremlin_live_hydration_v03.py
          tests/test_gremlin_relational_compiler_v01.py
          tests/test_gremlin_relational_compiler_integrity_v01.py
          tests/test_gremlin_relational_admission_v01.py
          tests/test_gremlin_relation_mining_adapter_v01.py
          tests/test_gremlin_relation_mining_admission_v01.py
          tests/test_gremlin_kaku_resolver_v01.py
          tests/test_gremlin_kaku_resolver_admission_v01.py
          tests/test_gremlin_kaku_resolver_pipeline_v01.py
          tests/test_tau_frame_codec_v01.py
          tests/test_pnh5_tau_realization_v01.py
          tests/test_gremlin_tau_codec_v01.py
          tests/test_gremlin_isomorphic_codec_merge_v01.py
          tests/test_gremlin_inverse_lineage_v01.py
          tests/test_gremlin_pnv_holonomy_v01.py
          tests/test_gremlin_pnv_holonomy_effect_boundary_v01.py
          tests/test_pnv_holonomy_numeric_hardening_v01.py
          tests/test_pnv_source_holonomy_v01.py
          tests/test_pnv_noether_collective_holonomy_v01.py
          tests/test_pnv_noether_rfc_current_holonomy_v01.py
          tests/test_pnv_scalar_field_rotor_reduction_v01.py
          tests/test_pnv_gauge_covariant_phase_pullback_v01.py
          tests/test_gremlin_pnv_bridge_source_holonomy_v02.py
          tests/test_gremlin_pnv_bridge_noether_collective_v02.py
          tests/test_gremlin_pnv_bridge_noether_rfc_current_v02.py
          tests/test_gremlin_pnv_bridge_scalar_field_rotor_v02.py
          tests/test_gremlin_pnv_bridge_gauge_covariant_pullback_v02.py
          tests/test_dncrypt_native_pncs_v04_causality.py
          tests/test_fpdg_gremlin_pain_ingress_v01.py
          tests/test_gremlin_cross_formalism_bank_v02.py
          tests/test_gremlin_cross_formalism_sealed_bundle_v01.py
          tests/test_gremlin_cross_formalism_round28_v01.py
          tests/test_gremlin_round28_sealed_bundle_v01.py
          tests/test_gremlin_noema_qhtri_isomorphism_bank_v01.py
          tests/test_semantic_orbital_carrier_v01.py
          tests/test_semantic_orbital_carrier_admission_v01.py
          tests/test_semantic_actuation_radical_admission_v01.py
          tests/test_semantic_orbital_trajectory_v01.py
          tests/test_semantic_orbital_trajectory_admission_v01.py
          tests/test_semantic_orbital_htri_bridge_v01.py
          tests/test_semantic_htri_lane_profile_immutability_v01.py
          tests/test_semantic_htri_snapshot_immutability_v01.py
          tests/test_semantic_orbital_htri_bounded_v01.py
          tests/test_semantic_magnitude_actuation_firewall_v01.py
          tests/test_semantic_radical_oscillator_v01.py
          tests/test_semantic_htri_drive_v32.py
          tests/test_semantic_htri_bounded_v33.py
          tests/test_pnlf_orbital_memory_v01.py
          tests/test_pnlf_orbital_memory_admission_v01.py
          tests/test_semantic_phase_inverse_v02.py
          tests/test_semantic_phase_inverse_admission_v02.py
          tests/test_semantic_orbital_trajectory_v03.py
          tests/test_semantic_orbital_trajectory_admission_v03.py
      - name: Generate authoritative tracked-tree manifest candidate
        run: python scripts/regenerate_manifest.py --root .
      - name: Verify generated manifest candidate
        run: python scripts/regenerate_manifest.py --root . --check
      - name: Record exact closure identities
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          raw = Path('MANIFEST.sha256.json').read_bytes()
          Path('MANIFEST.sha256.json.sha256').write_text(hashlib.sha256(raw).hexdigest() + '\n', encoding='utf-8')
          Path('MANIFEST.source_commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True), encoding='utf-8')
          Path('MANIFEST.source_tree.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True), encoding='utf-8')
          PY
      - name: Upload compact release-closure provenance
        uses: actions/upload-artifact@v4
        with:
          name: pncs-v1-release-closure-manifest
          retention-days: 1
          path: |
            MANIFEST.sha256.json
            MANIFEST.sha256.json.sha256
            MANIFEST.source_commit.txt
            MANIFEST.source_tree.txt
          if-no-files-found: error
