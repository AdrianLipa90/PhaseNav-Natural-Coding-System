name: PNCS v1 release closure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v028-release-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run frozen v0.28 release-closure corpus
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_adversarial_v28.py
          tests/test_adversarial_authority_v28.py
          tests/test_execution_orch_v27.py
          tests/test_semantic_equivalence_v28.py
          tests/test_adversarial_dynamics_v28.py
          tests/test_orch_hydro_v27.py
          tests/test_orch_package_v27.py
          tests/test_hydro_time_v27.py
          tests/test_hydro_schedule_v27.py
          tests/test_branch_session_collision_v28.py
          tests/test_manifest_tool_v28.py
          tests/test_repository_conformance_v28.py
          tests/test_release_train_v1.py
          tests/test_release_train_native_v1.py

  manifest-and-exact-source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify manifest tool and release-train tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_manifest_tool_v28.py tests/test_release_train_v1.py tests/test_release_train_native_v1.py
      - name: Generate authoritative tracked-tree manifest candidate
        run: python scripts/regenerate_manifest.py --root .
      - name: Verify generated manifest candidate
        run: python scripts/regenerate_manifest.py --root . --check
      - name: Record exact closure identities
        run: python -c "import hashlib,subprocess; from pathlib import Path; raw=Path('MANIFEST.sha256.json').read_bytes(); Path('MANIFEST.sha256.json.sha256').write_text(hashlib.sha256(raw).hexdigest()+'\\n',encoding='utf-8'); Path('MANIFEST.source_commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True)); Path('MANIFEST.source_tree.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True)); subprocess.run(['git','archive','--format=zip','--output=PNCS_closure_source.zip','HEAD'],check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: pncs-v1-release-closure-candidate
          path: |
            MANIFEST.sha256.json
            MANIFEST.sha256.json.sha256
            MANIFEST.source_commit.txt
            MANIFEST.source_tree.txt
            PNCS_closure_source.zip
          if-no-files-found: error
