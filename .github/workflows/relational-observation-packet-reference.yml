name: Relational observation packet reference

on:
  pull_request:
    paths:
      - 'spec/PNCS_RELATIONAL_OBSERVATION_PACKET_V0_1.md'
      - 'src/phasenav_natural_code/relational_observation_v01.py'
      - 'tests/test_relational_observation_v01.py'
      - '.github/workflows/relational-observation-packet-reference.yml'
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run relational observation packet tests
        run: python -m pytest -q tests/test_relational_observation_v01.py
