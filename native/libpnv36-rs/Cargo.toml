[package]
name = "libpnv36"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Strict 36D native execution primitives for PhaseNav"
license = "LicenseRef-Repository-License"
publish = false

[lib]
name = "pnv36"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []

[profile.release]
lto = "thin"
codegen-units = 1
